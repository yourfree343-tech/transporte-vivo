name: Probar el puente
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== redirección"; curl -s -o /dev/null -w "  raiz vercel: %{http_code} -> %{redirect_url}\n" https://transporte-vivo.vercel.app/
          B='https://transporte-vivo.vercel.app/api/proxy?url='
          for U in \
            'https://opendata.euskadi.eus/transport/moveuskadi/bizkaibus/gtfsrt_Bizkaibus_vehicle_positions.pb' \
            'https://opendata.euskadi.eus/transport/moveuskadi/euskotren/gtfsrt_euskotren_vehicle_positions.pb' \
            'https://opendata.euskadi.eus/transport/moveuskadi/tuvisa/gtfsrt_tuvisa_vehicle_positions.pb' \
            'https://ctb-gtfs-rt.s3.eu-south-2.amazonaws.com/metro-bilbao-vehicle-positions.pb' \
            'https://gtfs.emtmalaga.es/GTFSRTapi/api/vehicleposition' \
            'https://api.control.optibus.co/opendata/v1/gtfs-rt/vehicle-positions?uid=c-5cfcd2d1' \
            'https://gtfsrt.renfe.com/vehicle_positions_LD.json' ; do
            E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$U")
            echo "== $U"
            curl -s -o /tmp/d -m 20 -w "  directo: %{http_code} %{time_total}s %{size_download}B\n" "$U"
            N=$(echo "$U" | md5sum | cut -c1-8); mkdir -p muestras
            curl -s -o muestras/$N.bin -m 20 -w "  puente : %{http_code} %{time_total}s %{size_download}B\n" "$B$E"; echo "$N $U" >> muestras/indice.txt
          done
      - uses: actions/checkout@v4
        with: { path: repo }
      - name: Leer las muestras con el decodificador de la web
        run: |
          cat > leer.js <<'JS'
          const fs = require('fs');
          global.window = {}; global.fetch = () => Promise.reject('x');
          eval(fs.readFileSync('repo/feeds-client.js', 'utf8'));
          for (const line of fs.readFileSync('muestras/indice.txt', 'utf8').trim().split('\n')) {
            const [n, u] = line.split(' ');
            const buf = fs.readFileSync('muestras/' + n + '.bin');
            try {
              if (u.endsWith('.json')) { const j = JSON.parse(buf); console.log('OK JSON', (j.entity || []).length, u); continue; }
              const ents = window.FeedsClient.decodePB(buf);
              const withPos = ents.filter(e => e.vehicle && e.vehicle.position);
              console.log('OK', ents.length, 'entidades,', withPos.length, 'con posición', u, JSON.stringify(withPos[0] || ents[0] || {}).slice(0, 200));
            } catch (e) { console.log('FALLA', u, e.message, 'bytes', buf.length, buf.slice(0, 16).toString('hex')); }
          }
          JS
          node leer.js
